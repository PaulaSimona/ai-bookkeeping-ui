<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- S32 C2 (E2 fix): Inter + JetBrains Mono were declared in index.css but
         never loaded, so every page silently fell back to system-ui. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>AI Bookkeeping — You run the business. We keep the books.</title>
    <meta name="description" content="Bookkeeping done for you. Receipt automation is live today — free trial, 5 documents, no credit card required. Advanced double-entry books in development." />
    <meta name="keywords" content="AI bookkeeping, Canadian bookkeeping software, GST HST tracking, small business bookkeeping, freelancer accounting" />
    <meta name="google-site-verification" content="X5QXV0AKPHdl38vG1dD0VjIInu2f2XAnEkl7BNhjWLM" />

    <!-- S32 C4: static social cards. The SPA never rewrites these — crawlers
         and link unfurlers read the raw HTML, which JS never reaches. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ai-bookkeeping.ai/" />
    <meta property="og:site_name" content="AI Bookkeeping" />
    <meta property="og:title" content="AI Bookkeeping — You run the business. We keep the books." />
    <meta property="og:description" content="Bookkeeping done for you. Receipt automation is live today — free trial, 5 documents, no credit card required. Advanced double-entry books in development." />
    <meta property="og:image" content="https://ai-bookkeeping.ai/og/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AI Bookkeeping — You run the business. We keep the books." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Bookkeeping — You run the business. We keep the books." />
    <meta name="twitter:description" content="Bookkeeping done for you. Receipt automation is live today — free trial, 5 documents, no credit card required. Advanced double-entry books in development." />
    <meta name="twitter:image" content="https://ai-bookkeeping.ai/og/home.png" />

    <!-- The SINGLE Organization block for the whole site (S32 C4). The
         LandingPage no longer injects a second one. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Time2Win Inc.",
      "url": "https://ai-bookkeeping.ai/",
      "logo": "https://ai-bookkeeping.ai/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@ai-bookkeeping.ai",
        "contactType": "customer support"
      },
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <a href="https://launchbuff.com" target="_blank" rel="noopener noreferrer"
       title="Featured on LaunchBuff"
       style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">
      <img src="https://launchbuff.com/badge-featured-dark.svg"
           alt="Featured on LaunchBuff" width="256" height="80" />
    </a>
    <a href="https://tools.cafe" target="_blank" rel="noopener noreferrer"
       title="Featured on tools.cafe"
       style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">
      <img src="https://tools.cafe/b/dark.svg"
           alt="Featured on tools.cafe" width="256" height="80" />
    </a>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
